
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Location</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #ddd6fe 0%, transparent 35%),
                radial-gradient(circle at bottom right, #bfdbfe 0%, transparent 35%),
                #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .top-section {
            text-align: center;
            margin-bottom: 28px;
        }

        .location-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 24px;
            background: #ede9fe;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 36px;
            color: #111827;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 19px;
            line-height: 1.5;
        }

        .card {
            background: white;
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            border: 1px solid #e5e7eb;
        }

        .label {
            display: block;
            font-size: 16px;
            font-weight: bold;
            color: #6b7280;
            margin-bottom: 12px;
        }

        #name {
            width: 100%;
            height: 64px;
            border: 2px solid #9ca3af;
            border-radius: 22px;
            padding: 0 22px;
            font-size: 21px;
            outline: none;
        }

        #name:focus {
            border-color: #6366f1;
        }

        .code-title {
            margin-top: 30px;
        }

        #workerCode {
            height: 90px;
            width: 100%;
            background: #f5f3fa;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
            letter-spacing: 5px;
            color: #111827;
            margin-bottom: 30px;
        }

        button {
            width: 100%;
            min-height: 60px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            margin-top: 12px;
            padding: 12px;
        }

        #startBtn {
            background: #6366a6;
            color: white;
        }

        #startBtn:disabled,
        #stopBtn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        #stopBtn {
            display: none;
            background: white;
            color: #dc2626;
            border: 2px solid #dc2626;
        }

        .status-box {
            margin-top: 28px;
            padding: 22px;
            border-radius: 22px;
            background: #ecfdf5;
            border: 1px solid #bbf7d0;
        }

        .status-title {
            color: #16a34a;
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .status-text {
            color: #4b5563;
            font-size: 16px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .status-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            background: #16a34a;
            border-radius: 50%;
            margin-right: 10px;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            .location-icon {
                width: 82px;
                height: 82px;
                font-size: 42px;
            }

            h1 {
                font-size: 31px;
            }

            .subtitle {
                font-size: 17px;
            }

            .card {
                padding: 24px 18px;
                border-radius: 24px;
            }

            #name {
                height: 60px;
                font-size: 19px;
            }

            #workerCode {
                height: 82px;
                font-size: 34px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="top-section">
            <div class="location-icon">📍</div>
            <h1>Worker Location</h1>
            <div class="subtitle">
                Share your live location securely<br>
                with your administrator.
            </div>
        </div>

        <div class="card">
            <label class="label" for="name">WORKER NAME</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                autocomplete="name"
            >

            <label class="label code-title">WORKER CODE</label>
            <div id="workerCode">---</div>

            <button id="startBtn" type="button">
                📍 Start Sharing Location
            </button>

            <button id="stopBtn" type="button">
                ■ Stop Sharing
            </button>
        </div>

        <div class="status-box">
            <div class="status-title">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusTitle">Location Sharing Inactive</span>
            </div>

            <div class="status-text" id="status">
                Your location is not being shared.
            </div>
        </div>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const nameInput = document.getElementById("name");
        const workerCode = document.getElementById("workerCode");
        const startBtn = document.getElementById("startBtn");
        const stopBtn = document.getElementById("stopBtn");
        const status = document.getElementById("status");
        const statusTitle = document.getElementById("statusTitle");
        const statusDot = document.getElementById("statusDot");

        let watchId = null;
        let sharing = false;
        let nativeStarting = false;
        let lastNativeStatus = "";

        function makeCode(name) {
            return name.trim().toUpperCase().substring(0, 3).padEnd(3, "-");
        }

        function setStatus(title, message, active) {
            statusTitle.textContent = title;
            status.textContent = message;
            statusDot.style.background = active ? "#16a34a" : "#9ca3af";
            statusDot.style.boxShadow = active
                ? "0 0 0 4px rgba(22,163,74,0.12)"
                : "none";
        }

        function showSharingButtons(active) {
            sharing = active;
            startBtn.style.display = active ? "none" : "block";
            stopBtn.style.display = active ? "block" : "none";
            startBtn.disabled = false;
            stopBtn.disabled = false;
        }

        function setNativeLocationStatus(message) {
            const text = String(message || "");
            const lower = text.toLowerCase();
            lastNativeStatus = text;

            if (lower.includes("stopped")) {
                nativeStarting = false;
                showSharingButtons(false);
                setStatus("Location Sharing Inactive", text, false);
                return;
            }

            if (
                lower.includes("permission denied") ||
                lower.includes("permission is required") ||
                lower.includes("location is off") ||
                lower.includes("enable location") ||
                lower.includes("unable to") ||
                lower.includes("could not start")
            ) {
                nativeStarting = false;
                showSharingButtons(false);
                setStatus("Location Sharing Inactive", text, false);
                return;
            }

            if (lower.includes("already sharing")) {
                nativeStarting = false;
                showSharingButtons(true);
                setStatus(
                    "Already Sharing",
                    "You are already sharing your location.",
                    true
                );
                return;
            }

            if (lower.includes("location service started")) {
                // This only confirms the service start request, not a fresh GPS fix.
                nativeStarting = true;
                setStatus(
                    "Starting Location Sharing",
                    "Waiting for your phone to provide a location fix...",
                    false
                );
                return;
            }

            nativeStarting = true;
            setStatus("Starting Location Sharing", text, false);
        }

        // Android MainActivity calls this function to update the page.
        window.setNativeLocationStatus = setNativeLocationStatus;

        nameInput.addEventListener("input", () => {
            workerCode.textContent = makeCode(nameInput.value);
        });

        function restoreAndroidState() {
            if (!window.AndroidLocation) return;

            try {
                const savedName = window.AndroidLocation.getSavedName();
                if (savedName) {
                    nameInput.value = savedName;
                    workerCode.textContent = makeCode(savedName);
                } else {
                    workerCode.textContent = makeCode(nameInput.value);
                }

                // isSharing() must be backed by a fresh location heartbeat in MainActivity.
                const active = window.AndroidLocation.isSharing();
                if (active) {
                    nativeStarting = false;
                    showSharingButtons(true);
                    setStatus(
                        "Already Sharing",
                        "You are already sharing your location.",
                        true
                    );
                } else if (!nativeStarting) {
                    showSharingButtons(false);
                    setStatus(
                        "Location Sharing Inactive",
                        "Your location is not being shared. Tap Start Sharing to begin.",
                        false
                    );
                }
            } catch (error) {
                console.log("Could not restore Android state:", error);
            }
        }

        workerCode.textContent = makeCode(nameInput.value);

        // START SHARING
        startBtn.addEventListener("click", () => {
            const name = nameInput.value.trim();

            if (!name) {
                alert("Please enter your name.");
                nameInput.focus();
                return;
            }

            if (sharing || nativeStarting) return;

            if (window.AndroidLocation) {
                nativeStarting = true;
                startBtn.disabled = true;
                setStatus(
                    "Starting Location Sharing",
                    "Checking permissions and phone Location settings...",
                    false
                );

                try {
                    window.AndroidLocation.startSharing(name);
                } catch (error) {
                    nativeStarting = false;
                    showSharingButtons(false);
                    setStatus(
                        "Unable to Start",
                        "Please close and reopen the app, then try again.",
                        false
                    );
                }
                return;
            }

            if (!navigator.geolocation) {
                alert("Location is not supported on this device.");
                return;
            }

            showSharingButtons(true);
            setStatus(
                "Waiting for Location",
                "Please allow location access on your device.",
                false
            );

            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const locationData = {
                        name: name,
                        code: makeCode(name),
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        accuracy: position.coords.accuracy,
                        time: new Date().toISOString()
                    };

                    socket.emit("worker-location", locationData);
                    setStatus(
                        "Location Sharing Active",
                        "Your location is being shared.",
                        true
                    );
                },
                (error) => {
                    if (watchId !== null) {
                        navigator.geolocation.clearWatch(watchId);
                        watchId = null;
                    }
                    showSharingButtons(false);
                    setStatus("Location Error", error.message, false);
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 5000,
                    timeout: 15000
                }
            );
        });

        // STOP SHARING
        stopBtn.addEventListener("click", () => {
            if (window.AndroidLocation) {
                try {
                    window.AndroidLocation.stopSharing();
                } catch (error) {
                    console.log("Could not stop Android service:", error);
                }
                nativeStarting = false;
            } else {
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }
                socket.emit("worker-stop");
            }

            showSharingButtons(false);
            setStatus(
                "Location Sharing Inactive",
                "Your location sharing has been stopped.",
                false
            );
        });

        socket.on("connect", () => console.log("Connected to location server."));
        socket.on("connect_error", (error) => {
            console.log("Server connection error:", error.message);
        });

        restoreAndroidState();
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden) restoreAndroidState();
        });
        window.addEventListener("pageshow", restoreAndroidState);

        if (window.AndroidLocation) {
            window.setInterval(restoreAndroidState, 5000);
        }
    </script>
</body>
</html>
